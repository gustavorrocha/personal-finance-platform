server {
    listen 8080;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    location / {
        proxy_pass http://clickhouse:8123;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-ClickHouse-User $http_x_clickhouse_user;
        proxy_set_header X-ClickHouse-Key $http_x_clickhouse_key;
        proxy_set_header X-ClickHouse-Database $http_x_clickhouse_database;
        proxy_set_header X-ClickHouse-Format $http_x_clickhouse_format;
    }
}
