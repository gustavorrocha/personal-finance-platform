server {
    listen 8080 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 421;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host api;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location ~ "^/api/spending(/(rules|reviews|suggestions|(categories|manual)(/[0-9a-f-]{36})?|savings-box-suggestions(/dismiss)?))?$" {
        client_max_body_size 4k;
        proxy_pass http://api:8000;
        proxy_set_header Host api;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 65s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /api/accounts {
        proxy_pass http://api:8000/api/accounts;
        proxy_set_header Host api;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location = /api/accounts/history {
        proxy_pass http://api:8000/api/accounts/history;
        proxy_set_header Host api;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location ~ "^/api/investments(/(classes(/[0-9a-f-]{36})?|assignments))?$" {
        client_max_body_size 4k;
        proxy_pass http://api:8000;
        proxy_set_header Host api;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
}
